name: 问题反馈
description: 报告可复现的玩法、界面或兼容性问题
body:
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 写明模式、关卡、角色和操作。不要发送凭据或玩家数据文件。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际表现
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 游戏版本、设备和浏览器
      placeholder: 例如 0.8.13 / Android / Chrome
