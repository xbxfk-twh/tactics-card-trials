name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-and-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Audit public tracked files
        run: node scripts/audit-public.cjs
      - name: Install locked dependencies
        working-directory: apps/web
        run: npm ci
      - name: Rules, balance and local networking
        working-directory: apps/web
        run: npm test
      - name: Build offline and room-server packages
        working-directory: apps/web
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tactics-web-packages
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  mobile-browser:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Mobile campaign and combat flow
        working-directory: apps/web
        run: node tests/browser-smoke.cjs --mobile --capture
      - name: Opening party sizes and real encounter preview
        working-directory: apps/web
        run: node tests/party-opening-browser.cjs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Build and verify TapTap H5 host profile (mock SDK)
        working-directory: apps/web
        run: |
          npm run build:taptap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:taptap
